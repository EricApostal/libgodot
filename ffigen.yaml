# Generates lib/src/godot_core_bindings.g.dart from native/godot_core/godot_core.h, the shared
# C core macos/ and linux/ both link against (see that header's own doc comment for why this
# exists). Regenerate after editing godot_core.h:
#   dart run ffigen --config ffigen.yaml
name: GodotCoreBindings
description: >
  FFI bindings for native/godot_core/godot_core.h. Generated; do not edit by hand.
output: 'lib/src/godot_core_bindings.g.dart'
headers:
  entry-points:
    - 'native/godot_core/godot_core.h'
  include-directives:
    - 'native/godot_core/godot_core.h'
compiler-opts:
  - '-Ithird_party/godot'
# GDExtensionInitializationLevel/GodotOffscreenSurfaceType are plain C enums with no explicit
# underlying type; ffigen's default int-sized mimicking matches every compiler this engine
# actually ships for (the ABI these enums cross is godot's own GDExtension interface, which
# already assumes this).
silence-enum-warning: true
functions:
  include:
    - 'godot_core_.*'
structs:
  include:
    - 'GodotOffscreenFrame'
unions:
  include:
    - 'GodotOffscreenFrame'
typedefs:
  include:
    - 'GodotCoreHandle'
    - 'GodotOffscreenFrameCallback'
    - 'GodotOffscreenSurfaceType'
    - 'GDExtensionInitializationFunction'
    - 'GDExtensionBool'
    - 'GDExtensionObjectPtr'
preamble: |
  // Generated by package:ffigen from native/godot_core/godot_core.h. Do not edit by hand; run
  // `dart run ffigen --config ffigen.yaml` from the repo root to regenerate.
